name: release

# Publishes leadgen-mcp to PyPI when a GitHub Release is published.
# No API token anywhere: PyPI Trusted Publishing (GitHub OIDC), for this
# repository, this workflow file (release.yml) and the environment "pypi".
# The tag must be vX.Y.Z and match the version in pyproject.toml and
# leadgen_mcp/__init__.py, or nothing is built and nothing is published.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build and check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release_version.py "$TAG"
      - name: No private data
        run: python scripts/check_public.py
      - name: Unit tests
        run: |
          python -m pip install ".[test]"
          python -m pytest -q
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/leadgen-mcp/
    permissions:
      contents: read
      id-token: write # Trusted Publishing: the OIDC token is the only credential
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
